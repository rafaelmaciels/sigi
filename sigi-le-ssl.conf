<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName sigigreja.ddns.net
    ServerAlias www.sigigreja.ddns.net
    ServerAdmin admin@sigigreja.ddns.net

    WSGIDaemonProcess sigi_ssl python-home=/var/www/sigi/venv python-path=/var/www/sigi
    WSGIProcessGroup sigi_ssl
    WSGIScriptAlias / /var/www/sigi/app.wsgi

    <Directory /var/www/sigi/app>
        Require all granted
    </Directory>

    Alias /static /var/www/sigi/app/static
    <Directory /var/www/sigi/app/static>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/sigi_error_ssl.log
    CustomLog ${APACHE_LOG_DIR}/sigi_access_ssl.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/sigigreja.ddns.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sigigreja.ddns.net/privkey.pem

    # 🔒 Cabeçalhos de segurança recomendados
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self';"
</VirtualHost>
</IfModule>
