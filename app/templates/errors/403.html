<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Não Autorizado (403) — SiGI</title>
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/base.css') }}" rel="stylesheet">
  <style>
    body {
      background: var(--sigi-bg-app, #f8fafc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .error-card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--sigi-border, #e2e8f0);
      border-radius: var(--sigi-radius-lg, 16px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      padding: 3rem 2rem;
      text-align: center;
    }
    .error-badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fee2e2;
      color: #ef4444;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-badge">
      <i class="bi bi-shield-x"></i>
    </div>
    <h3 class="fw-bold text-dark mb-2">Acesso Não Autorizado</h3>
    <p class="text-muted mb-4">
      Você não possui as permissões ministeriais necessárias para acessar este módulo ou recurso no sistema.
    </p>
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary px-4">
      <i class="bi bi-arrow-left me-1"></i> Voltar ao Início
    </a>
  </div>
</body>
</html>
