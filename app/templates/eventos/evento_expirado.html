<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evento Expirado — SiGI</title>
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/base.css') }}" rel="stylesheet">
  <style>
    body {
      background: var(--sigi-bg-app, #f8fafc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .expirado-card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--sigi-border, #e2e8f0);
      border-radius: var(--sigi-radius-lg, 16px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      padding: 3rem 2rem;
      text-align: center;
    }
    .expirado-badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="expirado-card">
    <div class="expirado-badge">
      <i class="bi bi-calendar-x"></i>
    </div>
    <h3 class="fw-bold text-dark mb-2">Evento Encerrado</h3>
    <p class="text-muted mb-4">
      O evento <strong>{{ evento.titulo }}</strong> já foi concluído ou a divulgação pública não está mais ativa.
    </p>
  </div>
</body>
</html>
