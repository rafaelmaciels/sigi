<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evento Expirado — SiGI</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon/favicon-32x32.png') }}">
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/base.css') }}" rel="stylesheet">
  
  <style>
    html {
      height: 100%;
    }
    body {
      background-color: var(--sigi-bg-app, #f8fafc) !important;
      min-height: 100vh;
      height: auto !important;
      overflow-y: auto !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem !important;
    }
    .expirado-card {
      max-width: 540px;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--sigi-border, #e2e8f0);
      border-radius: var(--sigi-radius-lg, 20px);
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
      padding: 3.5rem 2rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .expirado-badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fef2f2;
      color: #ef4444;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }
    .public-footer {
      text-align: center;
      color: var(--sigi-text-muted, #64748b);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div class="expirado-card">
    <div class="expirado-badge">
      <i class="bi bi-calendar-x"></i>
    </div>
    <h3 class="fw-bold text-dark mb-2">Evento Encerrado ou Expirado</h3>
    <p class="text-muted mb-4">
      O link público para <strong>{{ evento.titulo }}</strong> não está mais ativo ou a data de divulgação encerrou.
    </p>
    <a href="javascript:window.history.back()" class="btn btn-outline-primary px-4 rounded-pill">
      <i class="bi bi-arrow-left me-1"></i> Voltar
    </a>
  </div>

  <footer class="public-footer">
    <div>&copy; {{ current_year or 2026 }} <strong>SiGI</strong> &mdash; Sistema Integrado de Gestão de Igreja</div>
    <div class="text-muted small mt-1">Desenvolvido por Paulo Soares</div>
  </footer>
</body>
</html>
